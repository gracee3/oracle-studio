[package]
name = "oracle-studio-ui"
version = "0.1.0"
description = "Open browser-local Leptos interface for Oracle Studio"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oracle-studio-ui"
path = "src/main.rs"

[features]
default = ["csr"]
csr = ["leptos/csr"]

[dependencies]
js-sys.workspace = true
leptos.workspace = true
oracle-studio-core = { version = "0.1.0", path = "../oracle-studio-core" }
oracle-studio-location-catalog = { version = "0.1.0", path = "../oracle-studio-location-catalog" }
oracle-studio-platform = { version = "0.1.0", path = "../oracle-studio-platform" }
oracle-studio-worker = { version = "0.1.0", path = "../oracle-studio-worker" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "BeforeUnloadEvent",
    "Blob",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Url",
    "Window",
] }
