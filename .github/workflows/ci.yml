name: CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - native
          - wasm
          - release
          - browser
          - dependencies

permissions:
  contents: read

jobs:
  native:
    if: inputs.suite == 'all' || inputs.suite == 'native'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    if: inputs.suite == 'all' || inputs.suite == 'wasm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p astraeus-moshier
          -p oracle-studio-chart-player
          -p oracle-studio-worker
          -p oracle-studio-ui
      - name: Keep native Swiss code outside the worker graph
        run: |
          if cargo tree --locked --target wasm32-unknown-unknown -p oracle-studio-worker | grep -q astraeus-swiss; then
            echo "::error::astraeus-swiss entered the Oracle Web Worker dependency graph"
            exit 1
          fi

  release:
    if: inputs.suite == 'all' || inputs.suite == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install trunk --locked --version 0.21.14
      - run: trunk build --release --locked=true
        working-directory: crates/oracle-studio-ui
        env:
          NO_COLOR: "false"

  dependencies:
    if: inputs.suite == 'all' || inputs.suite == 'dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  browser:
    if: inputs.suite == 'all' || inputs.suite == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: scripts/browser-acceptance.sh
      - run: scripts/demo-acceptance.sh
